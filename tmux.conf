# 16 million color setup (requires 2.2+ iirc)
# (modernized: terminal-overrides is replaced with terminal-features.)
# (note the new flag -s: server-wide rather than -g for session-wide.)
set -sa terminal-features '*:RGB'
set -s default-terminal "tmux-256color"
set -s focus-events on

# support for extended keymaps, including the Shift (S) modifier
set -s extended-keys on
# "DCS sync": modern terminals can request screen freeze for TUI redraws
set -sa terminal-features '*:sync'

# Cursor shape forwarding overrides.
# https://github.com/neovim/neovim/wiki/FAQ#how-can-i-change-the-cursor-shape-in-the-terminal
# Tell tmux to forward cursor shape escape sequences.
set -sa terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[0 q:Cs=\E]12;%p1%s\007:Cr=\E]112\007'

# Change cursor to block in copy mode
set-hook -g pane-mode-changed 'if -F "#{m:*copy-mode*,#{pane_mode}}" \
  "set -p cursor-style block ; set -p cursor-colour \"#ffc66d\"" \
  "set -u -p cursor-style ; set -u -p cursor-colour"'

# Don't wait 500ms to send <esc> or vim responds slowly.
# https://unix.stackexchange.com/questions/608142/whats-the-effect-of-escape-time-in-tmux
set -s escape-time 0

# Visually display activity in all non-current windows, don't send bell.
# See: window-status-activity-style
set -wg monitor-activity on    # monitor activity...
set -wg activity-action  other # ... in other windows ...
set -wg visual-activity  off   # ... but don't flash
# Support clicking on panes to focus them, and scrolling, and so on.
set -wg mouse on

# Use C-a not C-b as prefix.
unbind C-b
set -g prefix C-a
# Press C-a again to actually use C-a! Very nice.
bind C-a send-prefix

# Make it easy to reload tmux config.
bind r source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf!"
# Quickly restart a dead pane.
bind k respawn-pane -k
# Quickly toggle the status line with 'b'.
bind b set status

# Split and retain the current pane's working directory.
bind C-s split-window -hc "#{pane_current_path}"
bind C-w split-window -vc "#{pane_current_path}"

# Quickly set and cycle window layouts.
bind -T root M-] next-layout
bind -T root M-[ previous-layout
bind -T root M-z select-layout -o

# Quick specific layout jumps using Meta+Arrows
bind -T root M-Up select-layout main-horizontal
bind -T root M-Down select-layout even-vertical
bind -T root M-Left select-layout main-vertical
bind -T root M-Right select-layout even-horizontal

#
# Theme
#
# Modified from https://github.com/dkeg/dots/blob/master/tmux.conf.
#
# · 00b7    ∙ 2219    ● 25cf    ◆ 25c6
#

set -wg window-status-format "#[bg=#313336]#[fg=colour3] ∙ #[bg=#313336]#[fg=colour7] #W  "
set -wg window-status-current-format "#[bg=#313336]#[fg=#43d08a] ∙ #[bg=#313336]#[fg=#eeeeee] #W  "
set -wg window-status-style dim    # dim inactive windows
set -wg window-status-current-style bright # brighten the active window
set -wg window-status-bell-style reverse # invert colors on bell
set -wg window-status-activity-style reverse # invert colors on bell
set -g status-bg '#43d08a' # color comes from rakr/two-firewatch
set -g status-fg '#eeeeee' # white, or basically white anyway
set -g status-justify right
set -g status-position bottom
set -g status-left ''  # don't print session_name
set -g status-right '' # don't print "pane_title" {date} {time}
set -g status-left-length 0  # hide left status entirely
set -g status-right-length 0 # hide right status entirely

# Dim the background and foreground of inactive panes very lightly
set -g window-style 'fg=#a0a4a8,bg=#2e3033'
set -g window-active-style 'fg=terminal,bg=terminal'
set -g pane-border-style 'fg=colour240,bg=#2e3033'
set -g pane-active-border-style 'fg=#43d08a,bg=terminal'

# Use zsh.
set-option -g default-shell /bin/zsh

# Focus panes with CTRL-{hjkl}. (NOT with Up/Down/Left/Right)
unbind Up
unbind Down
unbind Left
unbind Right

bind -r C-h select-pane -L
bind -r C-j select-pane -D
bind -r C-k select-pane -U
bind -r C-l select-pane -R

# Resize panes with {HJKL}.
bind -r H   resize-pane -L 5
bind -r J   resize-pane -D 5
bind -r K   resize-pane -U 5
bind -r L   resize-pane -R 5

# Use vi mode keybindings.
set  -g    status-keys vi  # status line bindings, e.g. command prompt
set  -w -g mode-keys   vi  # copy-mode bindings, e.g. after (prefix)-[

# Emulate Vim's text selection keybindings in copy-mode.
bind -T copy-mode-vi v     send -X begin-selection
bind -T copy-mode-vi C-v   send -X rectangle-toggle
bind -T copy-mode-vi y     send -X copy-pipe            'xclip -sel clip'
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel 'xclip -sel clip'

# Shortcuts for editing configuration.
bind M-v neww -n nvimconf 'nvim ~/.config/nvim/init.vim'
bind M-t neww -n tmuxconf 'nvim ~/.tmux.conf'
bind M-s neww -n sxhkdrc  'nvim ~/.config/sxhkd/sxhkdrc'
bind M-b neww -n bspwmrc  'nvim ~/.config/bspwm/bspwmrc'
bind M-d neww -n dunstrc  'nvim ~/.config/dunst/dunstrc'
bind M-x neww -n xinitrc  'nvim ~/.xinitrc'
bind M-z neww -n zshrc    'nvim ~/.zshrc.local'
bind M-C-k neww -n zshrc  'nvim ~/dev/personal/qmk-keymap/keyboards/preonic/keymaps/fluffywaffles/keymap.c'

# Hostname-specific settings should go in `.tmux.${HOST}.conf`.
# `run-shell` is required to use the `#h` hostname format string.
run-shell 'tmux source-file -q .tmux.#h.conf'
