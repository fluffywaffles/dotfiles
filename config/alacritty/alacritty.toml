# Alacritty Configuration - idleToes Theme

[colors.primary]
# Alternate backgrounds to try:
# background = "#36393f" # pretty light, a little too light
# background = "#343639" # roughly halfway between the above and below...
# background = "#323232" # neutral darkish grey
background = "#313336"
foreground = "#ffffff"

[colors.cursor]
text = "#000000"
cursor = "#d6d6d6"

[cursor.style]
shape = "Beam"
blinking = "On"

[font]
size = 8.0

[[keyboard.bindings]]
key = "="
mods = "Control"
action = "ResetFontSize"

[[keyboard.bindings]]
key = "+"
mods = "Control|Shift"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "-"
mods = "Control"
action = "DecreaseFontSize"

[window]
dynamic_padding = true

[general]
import = [
    "~/.dotfiles/config/alacritty/extended-keys.toml",
    "~/.dotfiles/config/alacritty/themes/idleToes-classic.toml",
]
