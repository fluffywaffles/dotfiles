# Alacritty Configuration - idleToes Theme

[colors.primary]
# Alternate backgrounds to try:
# background = "#36393f"
# background = "#343639"
background = "#323232"
foreground = "#ffffff"

[colors.cursor]
text = "#000000"
cursor = "#d6d6d6"

[colors.normal]
black   = "#323232"
red     = "#d25252"
green   = "#7fe173"
yellow  = "#ffc66d"
blue    = "#4099ff"
magenta = "#f680ff"
cyan    = "#bed6ff"
white   = "#eeeeec"

[colors.bright]
black   = "#535353"
red     = "#f07070"
green   = "#9dff91"
yellow  = "#ffe48b"
blue    = "#5eb7f7"
magenta = "#ff9dff"
cyan    = "#dcf4ff"
white   = "#ffffff"

[font]
size = 8.0

[[keyboard.bindings]]
key = "="
mods = "Control"
action = "ResetFontSize"

[[keyboard.bindings]]
key = "+"
mods = "Control"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "-"
mods = "Control"
action = "DecreaseFontSize"

[window]
dynamic_padding = true
