# The user manager's root slice shares user@1000.service's cgroup, and
# whatever it sends systemd-oomd for that cgroup replaces what PID 1 sent;
# left at auto, each reload of this manager ends oomd's watch on it.
[Slice]
ManagedOOMSwap=kill
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=50%
