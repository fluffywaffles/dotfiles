# Claude Code notifications carry urgency normal so they never take the critical palette.
# What needs answering is distinguished by category instead: a bright amber fill and no timeout,
# against the normal green that everything else keeps. This is the one block that inverts the
# foreground: a warm fill has to be light to read as warm rather than muddy, and a light fill
# wants dark text, which buys far more contrast than white-on-dark-amber ever had.

[claude-code-waiting]
    appname = "claude-code"
    category = "claude.waiting"
    timeout = 0
    background  = "#d9a441"
    foreground  = "#4a3410"
    highlight   = "#8a6410"
    frame_color = "#b8862b"
