# Claude Code notifications keep the normal palette; urgency alone separates something waiting on
# an answer from a finished turn.
#
# Only a notification waiting on an answer is pinned. Finished turns expire normally, because
# dunstctl can only ever action its OLDEST displayed notification — a pinned notification sits at
# that index forever and makes every newer one, from any application, unreachable by keyboard.

[claude-code-waiting]
    appname = "claude-code"
    category = "claude.waiting"
    timeout = 0
