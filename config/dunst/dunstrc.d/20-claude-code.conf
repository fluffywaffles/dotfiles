# Claude Code notifications carry urgency normal so they never take the critical palette.
# What needs answering is distinguished by category instead: an amber frame and no timeout,
# against the normal green that everything else keeps.

[claude-code-waiting]
    appname = "claude-code"
    category = "claude.waiting"
    timeout = 0
    background  = "#b8862b"
    foreground  = "#eeeeee"
    highlight   = "#e0ab45"
    frame_color = "#e0ab45"
