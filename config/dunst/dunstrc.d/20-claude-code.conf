# Claude Code notifications keep the normal palette; urgency alone separates something waiting on
# an answer from a finished turn.
#
# Everything is pinned, including finished turns. dunstctl can only ever action its OLDEST
# displayed notification, so a pinned one owns that address until it is dismissed — super + Tab
# fires and then closes, which is what keeps the stack walkable rather than stuck.
#
# The pinned set stays bounded because claude-notify-listen stack-tags per pane, so a session
# replaces its own notification rather than adding one: at most one pin per tmux pane.
#
# claude.waiting is the default category, so a permission prompt and anything unrecognised land
# here too rather than expiring unseen.

# notify-act dispatches on the source rather than on dunst's own action, because dunstctl can
# only address the oldest displayed notification and a scratchpad cannot be raised by one.
[claude-code-record]
    appname = "claude-code"
    script = ~/.local/bin/notify-record

[claude-code-waiting]
    appname = "claude-code"
    category = "claude.waiting"
    timeout = 0

[claude-code-done]
    appname = "claude-code"
    category = "claude.done"
    timeout = 0
