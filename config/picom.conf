# tunables reference: ~/.local/share/brain/waffles/dotfiles/memory/picom-glx-nvidia.md
backend = "glx";
vsync = true;
use-damage = false;
dithered-present = false;

shadow = false;
shadow-radius = 10;
shadow-opacity = 1.0;
shadow-offset-x = -10;
shadow-offset-y = -10;
crop-shadow-to-monitor = true;

fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;

frame-opacity = 0.9;
corner-radius = 4;
blur:
{
  method = "dual_kawase";
  strength = 2;
};

animations = ({
  triggers = [ "size", "position" ];
  scale-x = { curve = "cubic-bezier(0.2, 0.8, 0.2, 1)"; duration = 0.3; start = "window-width-before / window-width"; end = 1; };
  scale-y = { curve = "cubic-bezier(0.2, 0.8, 0.2, 1)"; duration = 0.3; start = "window-height-before / window-height"; end = 1; };
  offset-x = { curve = "cubic-bezier(0.2, 0.8, 0.2, 1)"; duration = 0.3; start = "window-x-before - window-x"; end = 0; };
  offset-y = { curve = "cubic-bezier(0.2, 0.8, 0.2, 1)"; duration = 0.3; start = "window-y-before - window-y"; end = 0; };
  shadow-scale-x = "scale-x";
  shadow-scale-y = "scale-y";
  shadow-offset-x = "offset-x";
  shadow-offset-y = "offset-y";
  saved-image-blend = { curve = "cubic-bezier(0.2, 0.8, 0.2, 1)"; duration = 0.3; start = 1; end = 0; };
});

rules = (
  { match = "!(focused || group_focused || override_redirect)"; dim = 0.2; },
  { match = "fullscreen"; corner-radius = 0; },
  { match = "class_g = 'Alacritty'"; animations = ({ triggers = [ "size", "position" ]; scale-x = { curve = "cubic-bezier(0.2, 0.8, 0.2, 1)"; duration = 0.3; start = "window-width-before / window-width"; end = 1; }; scale-y = { curve = "cubic-bezier(0.2, 0.8, 0.2, 1)"; duration = 0.3; start = "window-height-before / window-height"; end = 1; }; offset-x = { curve = "cubic-bezier(0.2, 0.8, 0.2, 1)"; duration = 0.3; start = "window-x-before - window-x"; end = 0; }; offset-y = { curve = "cubic-bezier(0.2, 0.8, 0.2, 1)"; duration = 0.3; start = "window-y-before - window-y"; end = 0; }; shadow-scale-x = "scale-x"; shadow-scale-y = "scale-y"; shadow-offset-x = "offset-x"; shadow-offset-y = "offset-y"; saved-image-blend = { duration = 0.05; start = 1; end = 0; }; }); },
  { match = "_BSPWM_SPLIT_DIR = 'east'"; animations = ({ triggers = [ "open" ]; offset-x = { curve = "cubic-bezier(0.2, 0.8, 0.2, 1)"; duration = 0.3; start = "window-width + 8"; end = 0; }; shadow-offset-x = "offset-x"; crop-x = "window-x"; crop-y = "window-y"; crop-width = "window-width"; crop-height = "window-height"; }, { triggers = [ "close" ]; offset-x = { curve = "cubic-bezier(0.2, 0.8, 0.2, 1)"; duration = 0.3; start = 0; end = "window-width + 8"; }; opacity = { duration = 0.3; start = "window-raw-opacity-before"; end = "window-raw-opacity-before"; }; shadow-offset-x = "offset-x"; crop-x = "window-x"; crop-y = "window-y"; crop-width = "window-width"; crop-height = "window-height"; }); },
  { match = "_BSPWM_SPLIT_DIR = 'west'"; animations = ({ triggers = [ "open" ]; offset-x = { curve = "cubic-bezier(0.2, 0.8, 0.2, 1)"; duration = 0.3; start = "0 - window-width - 8"; end = 0; }; shadow-offset-x = "offset-x"; crop-x = "window-x"; crop-y = "window-y"; crop-width = "window-width"; crop-height = "window-height"; }, { triggers = [ "close" ]; offset-x = { curve = "cubic-bezier(0.2, 0.8, 0.2, 1)"; duration = 0.3; start = 0; end = "0 - window-width - 8"; }; opacity = { duration = 0.3; start = "window-raw-opacity-before"; end = "window-raw-opacity-before"; }; shadow-offset-x = "offset-x"; crop-x = "window-x"; crop-y = "window-y"; crop-width = "window-width"; crop-height = "window-height"; }); },
  { match = "_BSPWM_SPLIT_DIR = 'south'"; animations = ({ triggers = [ "open" ]; offset-y = { curve = "cubic-bezier(0.2, 0.8, 0.2, 1)"; duration = 0.3; start = "window-height + 8"; end = 0; }; shadow-offset-y = "offset-y"; crop-x = "window-x"; crop-y = "window-y"; crop-width = "window-width"; crop-height = "window-height"; }, { triggers = [ "close" ]; offset-y = { curve = "cubic-bezier(0.2, 0.8, 0.2, 1)"; duration = 0.3; start = 0; end = "window-height + 8"; }; opacity = { duration = 0.3; start = "window-raw-opacity-before"; end = "window-raw-opacity-before"; }; shadow-offset-y = "offset-y"; crop-x = "window-x"; crop-y = "window-y"; crop-width = "window-width"; crop-height = "window-height"; }); },
  { match = "_BSPWM_SPLIT_DIR = 'north'"; animations = ({ triggers = [ "open" ]; offset-y = { curve = "cubic-bezier(0.2, 0.8, 0.2, 1)"; duration = 0.3; start = "0 - window-height - 8"; end = 0; }; shadow-offset-y = "offset-y"; crop-x = "window-x"; crop-y = "window-y"; crop-width = "window-width"; crop-height = "window-height"; }, { triggers = [ "close" ]; offset-y = { curve = "cubic-bezier(0.2, 0.8, 0.2, 1)"; duration = 0.3; start = 0; end = "0 - window-height - 8"; }; opacity = { duration = 0.3; start = "window-raw-opacity-before"; end = "window-raw-opacity-before"; }; shadow-offset-y = "offset-y"; crop-x = "window-x"; crop-y = "window-y"; crop-width = "window-width"; crop-height = "window-height"; }); },
  { match = "class_g = 'dmenu'"; corner-radius = 0; opacity = 0.99; blur-background = true; shader = { path = "picom/window-border.glsl"; defines = { BORDER_WIDTH = "0.0"; INNER_RADIUS_EXTRA = "0.0"; BACKGROUND_RGB = "vec3(0x22, 0x22, 0x22) / 255.0"; FOREGROUND_RGB = "vec3(0xdd, 0xdd, 0xdd) / 255.0"; BACKGROUND_ALPHA = "0.7"; }; }; },
  { match = "class_g = 'Bspwm' && class_i = 'presel_feedback'"; opacity = 0.45; dim = 0; blur-background = true; shadow = true; full-shadow = true; shader = "picom/window-border.glsl"; },
  { match = "class_g = 'dmenu' || (class_g = 'Bspwm' && class_i = 'presel_feedback')"; animations = ({ triggers = [ "open", "show" ]; opacity = { duration = 0.2; start = 0; end = "window-raw-opacity"; }; blur-opacity = "opacity"; shadow-opacity = "opacity"; }); },
);

detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
