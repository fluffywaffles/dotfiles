# tunables reference: ~/.local/share/brain/waffles/dotfiles/memory/picom-glx-nvidia.md
backend = "glx";
vsync = true;
use-damage = false;
dithered-present = false;

shadow = false;
shadow-radius = 10;
shadow-opacity = 1.0;
shadow-offset-x = -10;
shadow-offset-y = -10;
crop-shadow-to-monitor = true;

fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;

frame-opacity = 0.9;
corner-radius = 4;
blur:
{
  method = "dual_kawase";
  strength = 2;
};

animations = ({
  triggers = [ "size", "position" ];
  suppressions = [ "dim" ];
  crop-x = { curve = "cubic-bezier(0.2, 0.8, 0.2, 1)"; duration = 0.3; start = "window-x-before"; end = "window-x"; };
  crop-y = { curve = "cubic-bezier(0.2, 0.8, 0.2, 1)"; duration = 0.3; start = "window-y-before"; end = "window-y"; };
  crop-width = { curve = "cubic-bezier(0.2, 0.8, 0.2, 1)"; duration = 0.3; start = "window-width-before"; end = "window-width"; };
  crop-height = { curve = "cubic-bezier(0.2, 0.8, 0.2, 1)"; duration = 0.3; start = "window-height-before"; end = "window-height"; };
  v-dim-from = { duration = 0.2; start = "window-dim-before"; end = "window-dim-before"; };
  v-dim-left = { curve = "cubic-bezier(0.25, 0.1, 0.25, 1)"; duration = 0.2; start = 1; end = 0; };
  dim = "window-dim + (v-dim-from - window-dim) * v-dim-left";
}, {
  triggers = [ "show" ];
  suppressions = [ "size", "position", "dim" ];
  opacity = { duration = 0.3; start = 0; end = "window-raw-opacity"; };
  blur-opacity = "opacity";
  shadow-opacity = "opacity";
  v-dim-from = { duration = 0.2; start = "window-dim-before"; end = "window-dim-before"; };
  v-dim-left = { curve = "cubic-bezier(0.25, 0.1, 0.25, 1)"; duration = 0.2; start = 1; end = 0; };
  dim = "window-dim + (v-dim-from - window-dim) * v-dim-left";
}, {
  triggers = [ "hide" ];
  suppressions = [ "size", "position", "dim" ];
  opacity = { duration = 0.3; start = "window-raw-opacity-before"; end = 0; };
  blur-opacity = "opacity";
  shadow-opacity = "opacity";
}, {
  triggers = [ "dim" ];
  dim = { curve = "cubic-bezier(0.25, 0.1, 0.25, 1)"; duration = 0.2; start = "window-dim-before"; end = "window-dim"; };
});

rules = (
  { match = "!(focused || group_focused || override_redirect)"; dim = 0.2; },
  # A summoned scratchpad stays put when focus leaves it, but drops far enough back that you
  # can read through it.
  # What is blurred is the scratchpad itself rather than the desktop behind it: smearing its
  # own edges is what lets the window underneath read through, where blurring the backdrop
  # destroys the very thing the transparency is for. The same shader tilts it away from you,
  # a fragment shader having no geometry to rotate but being free to read as though it had.
  # It is attached in both states and reads dim as its clock rather than opacity: dim animates
  # on focus alone and is suppressed while a window shows or hides, so summoning and putting
  # away stay flat fades while only losing focus tilts it back. The shader takes dim purely as
  # that position and applies no darkening for it, which is why 1 here costs no brightness.
  # Showing and hiding hold dim at its destination rather than easing from where it was, which
  # is what keeps a summon from playing the recede backwards on its way in.
  { match = "class_g = 'slack' || class_g = 'linear'"; blur-background = false; shader = "picom/window-recede.glsl"; animations = ({ triggers = [ "show" ]; suppressions = [ "size", "position", "dim" ]; opacity = { duration = 0.3; start = 0; end = "window-raw-opacity"; }; blur-opacity = "opacity"; shadow-opacity = "opacity"; dim = "window-dim"; }, { triggers = [ "hide" ]; suppressions = [ "size", "position", "dim" ]; opacity = { duration = 0.3; start = "window-raw-opacity-before"; end = 0; }; blur-opacity = "opacity"; shadow-opacity = "opacity"; dim = "window-dim"; }, { triggers = [ "increase-opacity", "decrease-opacity" ]; opacity = { curve = "cubic-bezier(0.25, 0.1, 0.25, 1)"; duration = 0.3; start = "window-raw-opacity-before"; end = "window-raw-opacity"; }; blur-opacity = "opacity"; shadow-opacity = "opacity"; dim = { curve = "cubic-bezier(0.25, 0.1, 0.25, 1)"; duration = 0.3; start = "window-dim-before"; end = "window-dim"; }; }); },
  { match = "(class_g = 'slack' || class_g = 'linear') && !(focused || group_focused)"; opacity = 0.25; dim = 1.0; },
  { match = "fullscreen"; corner-radius = 0; },
  { match = "_BSPWM_SPLIT_DIR = 'east'"; animations = ({ triggers = [ "open" ]; suppressions = [ "size", "position", "dim" ]; offset-x = { curve = "cubic-bezier(0.2, 0.8, 0.2, 1)"; duration = 0.3; start = "window-width + 8"; end = 0; }; shadow-offset-x = "offset-x"; crop-x = "window-x"; crop-y = "window-y"; crop-width = "window-width"; crop-height = "window-height"; }, { triggers = [ "close" ]; suppressions = [ "size", "position", "dim" ]; offset-x = { curve = "cubic-bezier(0.2, 0.8, 0.2, 1)"; duration = 0.3; start = 0; end = "window-width + 8"; }; opacity = { duration = 0.3; start = "window-raw-opacity-before"; end = "window-raw-opacity-before"; }; shadow-offset-x = "offset-x"; crop-x = "window-x"; crop-y = "window-y"; crop-width = "window-width"; crop-height = "window-height"; }); },
  { match = "_BSPWM_SPLIT_DIR = 'west'"; animations = ({ triggers = [ "open" ]; suppressions = [ "size", "position", "dim" ]; offset-x = { curve = "cubic-bezier(0.2, 0.8, 0.2, 1)"; duration = 0.3; start = "0 - window-width - 8"; end = 0; }; shadow-offset-x = "offset-x"; crop-x = "window-x"; crop-y = "window-y"; crop-width = "window-width"; crop-height = "window-height"; }, { triggers = [ "close" ]; suppressions = [ "size", "position", "dim" ]; offset-x = { curve = "cubic-bezier(0.2, 0.8, 0.2, 1)"; duration = 0.3; start = 0; end = "0 - window-width - 8"; }; opacity = { duration = 0.3; start = "window-raw-opacity-before"; end = "window-raw-opacity-before"; }; shadow-offset-x = "offset-x"; crop-x = "window-x"; crop-y = "window-y"; crop-width = "window-width"; crop-height = "window-height"; }); },
  { match = "_BSPWM_SPLIT_DIR = 'south'"; animations = ({ triggers = [ "open" ]; suppressions = [ "size", "position", "dim" ]; offset-y = { curve = "cubic-bezier(0.2, 0.8, 0.2, 1)"; duration = 0.3; start = "window-height + 8"; end = 0; }; shadow-offset-y = "offset-y"; crop-x = "window-x"; crop-y = "window-y"; crop-width = "window-width"; crop-height = "window-height"; }, { triggers = [ "close" ]; suppressions = [ "size", "position", "dim" ]; offset-y = { curve = "cubic-bezier(0.2, 0.8, 0.2, 1)"; duration = 0.3; start = 0; end = "window-height + 8"; }; opacity = { duration = 0.3; start = "window-raw-opacity-before"; end = "window-raw-opacity-before"; }; shadow-offset-y = "offset-y"; crop-x = "window-x"; crop-y = "window-y"; crop-width = "window-width"; crop-height = "window-height"; }); },
  { match = "_BSPWM_SPLIT_DIR = 'north'"; animations = ({ triggers = [ "open" ]; suppressions = [ "size", "position", "dim" ]; offset-y = { curve = "cubic-bezier(0.2, 0.8, 0.2, 1)"; duration = 0.3; start = "0 - window-height - 8"; end = 0; }; shadow-offset-y = "offset-y"; crop-x = "window-x"; crop-y = "window-y"; crop-width = "window-width"; crop-height = "window-height"; }, { triggers = [ "close" ]; suppressions = [ "size", "position", "dim" ]; offset-y = { curve = "cubic-bezier(0.2, 0.8, 0.2, 1)"; duration = 0.3; start = 0; end = "0 - window-height - 8"; }; opacity = { duration = 0.3; start = "window-raw-opacity-before"; end = "window-raw-opacity-before"; }; shadow-offset-y = "offset-y"; crop-x = "window-x"; crop-y = "window-y"; crop-width = "window-width"; crop-height = "window-height"; }); },
  { match = "class_g = 'dmenu'"; corner-radius = 0; opacity = 0.99; blur-background = true; shader = { path = "picom/window-border.glsl"; defines = { BORDER_WIDTH = "0.0"; INNER_RADIUS_EXTRA = "0.0"; BACKGROUND_RGB = "vec3(0x22, 0x22, 0x22) / 255.0"; FOREGROUND_RGB = "vec3(0xdd, 0xdd, 0xdd) / 255.0"; BACKGROUND_ALPHA = "0.7"; }; }; },
  { match = "class_g = 'Bspwm' && class_i = 'presel_feedback'"; opacity = 0.45; dim = 0; blur-background = true; shadow = true; full-shadow = true; shader = "picom/window-border.glsl"; },
  { match = "class_g = 'dmenu' || (class_g = 'Bspwm' && class_i = 'presel_feedback')"; animations = ({ triggers = [ "open", "show" ]; opacity = { duration = 0.2; start = 0; end = "window-raw-opacity"; }; blur-opacity = "opacity"; shadow-opacity = "opacity"; }); },
);

# dim is scaled by a window's opacity unless this is set, which would drag the scratchpads'
# recede back out as they fade: the tilt is driven by dim and has to mean what the rule says.
inactive-dim-fixed = true;

detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
